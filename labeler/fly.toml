# Fly.io Configuration for Bluesky Misinformation Labeler
# https://fly.io/docs/reference/configuration/

app = "bluesky-labeler"
primary_region = "sjc"

[build]
  # Uses Dockerfile in current directory

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # NOTES_FILE is set to use volume mount
  NOTES_FILE = "/app/logic/notes-00000.tsv"
  # Adjust these based on your needs
  MAX_NOTES = "1000"
  SIMILARITY_THRESHOLD = "0.45"
  HIGH_CONFIDENCE_THRESHOLD = "0.70"

# Persistent storage for database, cache, and Community Notes
[mounts]
  source = "labeler_data"
  destination = "/data"

# HTTP service configuration (modern syntax)
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

# Health check - @skyware/labeler uses /xrpc/_health
[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "60s"
  method = "GET"
  path = "/xrpc/_health"

# Machine configuration
# Upgrade if you need more memory for large Community Notes datasets
[vm]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# Secrets (set via `fly secrets set`):
# - OPENAI_API_KEY: Your OpenAI API key
# - LABELER_DID: Your Bluesky DID (did:plc:...)
# - LABELER_PRIVATE_KEY: Private key for label signing
# - BSKY_HANDLE: Your Bluesky handle (for publish-labels.ts)
# - BSKY_PASSWORD: Your Bluesky app password
