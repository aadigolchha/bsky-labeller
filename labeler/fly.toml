app = "bluesky-labeler" 
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"

[mounts]
  source = "labeler_data"
  destination = "/data"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  
  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
  
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

